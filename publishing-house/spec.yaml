# PH migration intake draft. No workflow stage is changed by this file.
project:
  slug: praxis-ai-gateway
  owner_email: jkershaw@redhat.com
  content_type: lab
  deployment_mode: rhdp_published
  initiative_key: none
  showroom_type: classic
  intake_type: migration
  automation_type: both
  description: 'Migrate the existing Govern AI Model Access with Praxis lab into the
    RHDP Publishing House lifecycle. The 20–30 minute guided customer path has optional
    operations and governance depth up to 90 minutes. Learners use an OAuth-protected
    UI and a platform-managed model connection; backend credentials stay outside Showroom.
    Praxis is an upstream project. Preserve the existing source and AgnosticV review
    history while PH owns generated catalog configuration and onboarding. Tracking:
    GPTEINFRA-18273.'
  jira_ticket: RHDPCD-2133
  workflow_id: 7500271a-18f9-4c7f-adcf-2220e34ab027
spec:
  title: Govern AI Model Access with Praxis
  learning_objectives:
  - Demonstrate governed model access through an authenticated application boundary.
  - Prove platform-owned backend credentials and correlate request-level routing evidence.
  - Evaluate failure, tenant authorization and governance controls.
  modules:
  - id: module-01
    title: Orient to the customer experience
    duration_min: 5
    status: not_started
  - id: module-02
    title: Show governed model access
    duration_min: 10
    status: not_started
  - id: module-03
    title: Prove the application boundary
    duration_min: 15
    status: not_started
  - id: module-04
    title: Correlate evidence for one request
    duration_min: 15
    status: not_started
  - id: module-05
    title: Discuss failure and recovery
    duration_min: 15
    status: not_started
  - id: module-06
    title: Assess isolation and data controls
    duration_min: 15
    status: not_started
  - id: module-07
    title: Map the customer architecture
    duration_min: 15
    status: not_started
