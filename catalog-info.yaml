  name: praxis-ai-gateway
  title: praxis-ai-gateway
  description: "Migrate the existing Govern AI Model Access with Praxis lab into
    the RHDP Publishing House lifecycle. The 20–30 minute guided customer path
    has optional operations and governance depth up to 90 minutes. Learners use
    an OAuth-protected UI and a platform-managed model connection; backend
    credentials stay outside Showroom. Praxis is an upstream project. Preserve
    the existing source and AgnosticV review history while PH owns generated
    catalog configuration and onboarding. Tracking: GPTEINFRA-18273."
